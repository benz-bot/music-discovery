<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MusicHub</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎵 MusicHub</h1>
    <p>Discover music from official platforms</p>
  </header>

  <main>

    <input
      type="text"
      class="search-box"
      placeholder="Search songs or artists..."
    >

    <div class="categories">
      <button class="category-btn">All</button>
      <button class="category-btn">Bollywood</button>
      <button class="category-btn">Hindi</button>
      <button class="category-btn">English</button>
      <button class="category-btn">Assamese</button>
    </div>

    <div class="song-grid">
<div class="song-card" data-category="bollywood">

  <h3>Kesariya</h3>
  <p>Pritam, Arijit Singh</p>

  <div class="song-links">
    <a href="https://www.youtube.com/watch?v=NJAv_7lHUIU" target="_blank">YouTube</a>
    <a href="https://open.spotify.com/track/6VBhH7CyP56BXjp8VsDFPZ" target="_blank">Spotify</a>
    <a href="https://music.apple.com/in/song/1657154316" target="_blank">Apple Music</a>
  </div>

</div>

      <div class="song-card" data-category="hindi">
        <h3>Sample Hindi Song</h3>
        <p>Sample Artist</p>

        <div class="song-links">
          <a href="https://www.youtube.com/" target="_blank">YouTube</a>
          <a href="https://open.spotify.com/" target="_blank">Spotify</a>
          <a href="https://music.apple.com/" target="_blank">Apple Music</a>
        </div>
      </div>

      <div class="song-card" data-category="english">
  <h3>Perfect</h3>
  <p>Ed Sheeran</p>

  <div class="song-links">
    <a href="https://www.youtube.com/watch?v=ORrFJ63nlcA" target="_blank">YouTube</a>
    <a href="https://open.spotify.com/track/3EO99jI2wUGGpDTTuyRXDn" target="_blank">Spotify</a>
    <a href="https://music.apple.com/us/song/1672257806" target="_blank">Apple Music</a>
  </div>
      </div>

      <div class="song-card" data-category="assamese">
  <h3>Mayabini</h3>
  <p>Zubeen Garg</p>

  <div class="song-links">
    <a href="https://www.youtube.com/watch?v=o2uNk9lh5RU" target="_blank">YouTube</a>
    <a href="https://open.spotify.com/artist/3mpgtUc7wYBNjr04gEiQ4u" target="_blank">Spotify</a>
    <a href="https://music.apple.com/in/song/1783197874" target="_blank">Apple Music</a>
  </div>
      </div>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
