<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicHub</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎵 MusicHub</h1>
    <p>Discover songs from official music platforms</p>
  </header>

  <main>

    <input
      type="text"
      class="search-box"
      placeholder="Search songs or artists..."
    >

    <div class="categories">
      <button class="category-btn">All</button>
      <button class="category-btn">Bollywood</button>
      <button class="category-btn">Hindi</button>
      <button class="category-btn">English</button>
      <button class="category-btn">Assamese</button>
    </div>

    <div class="song-grid">

      <div class="song-card">
        <h3>Sample Song</h3>
        <p>Sample Artist</p>

        <div class="song-links">
          <a href="#" target="_blank">YouTube</a>
          <a href="#" target="_blank">Spotify</a>
          <a href="#" target="_blank">Apple Music</a>
        </div>
      </div>

      <div class="song-card">
        <h3>Another Song</h3>
        <p>Another Artist</p>

        <div class="song-links">
          <a href="#" target="_blank">YouTube</a>
          <a href="#" target="_blank">Spotify</a>
          <a href="#" target="_blank">Apple Music</a>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
